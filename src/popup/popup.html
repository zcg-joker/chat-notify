<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chat Notify</title>
    <link rel="stylesheet" href="./popup.css">
  </head>
  <body>
    <main class="popup">
      <header class="header">
        <img src="../../assets/icon.svg" alt="" class="icon">
        <div>
          <h1>Chat Notify</h1>
          <p>Completion alerts for ChatGPT</p>
        </div>
      </header>

      <section class="status-area" aria-label="Status">
        <div class="status-row">
          <span>Page</span>
          <strong id="site-status">Checking page...</strong>
        </div>
        <div class="status-row">
          <span>Extension</span>
          <strong id="extension-status">Checking...</strong>
        </div>
        <div class="status-row">
          <span>Notifications</span>
          <strong id="notification-status">Not tested yet</strong>
        </div>
        <p id="notification-detail" class="notification-detail"></p>
        <div class="status-row">
          <span>Last completion</span>
          <strong id="completion-status">No completions yet</strong>
        </div>
      </section>

      <section class="status-group" aria-label="Recent activity">
        <div class="status-row">
          <span class="status-label">Recent</span>
          <span id="activity-summary" class="status-value">No recent activity</span>
        </div>
        <div id="activity-site" class="status-detail"></div>
        <div id="activity-prompt" class="status-detail"></div>
        <div id="activity-timeline" class="activity-timeline"></div>
      </section>

      <section class="probe-preview" aria-label="Probe preview">
        <div class="status-row">
          <span class="status-label">Probe</span>
          <span id="probe-readiness" class="status-value"></span>
        </div>
        <div id="probe-top-candidate" class="status-detail"></div>
        <div id="probe-risk" class="status-detail"></div>
      </section>

      <label class="toggle-row">
        <span>Enabled</span>
        <input id="enabled-toggle" type="checkbox">
      </label>

      <label class="toggle-row">
        <span>Debug logs</span>
        <input id="debug-logs-toggle" type="checkbox">
      </label>

      <button id="test-notification" type="button">Test notification</button>
      <button id="start-page-probe" type="button" disabled>Start page probe</button>
      <p id="start-page-probe-status" class="notification-detail"></p>
      <button id="copy-diagnostics" type="button">Copy diagnostics</button>
      <p id="copy-diagnostics-status" class="notification-detail"></p>

      <p class="privacy">
        Prompt excerpts stay in local memory for the active response and are cleared after notification.
      </p>
    </main>
    <script src="../shared/messages.js"></script>
    <script src="./popup.js"></script>
  </body>
</html>
